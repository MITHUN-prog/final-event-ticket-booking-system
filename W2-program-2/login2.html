<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="style.css">
<style>body { display: flex; flex-direction: column; min-height: 100vh; }</style>
</head>
<body>
<header>
  <h1>🎟 Online Event Ticket Booking</h1>
  <nav>
    <a href="index2.html">Home</a>
    <a href="catelogue2.html">Events</a>
    <a href="login2.html">Login</a>
    <a href="register2.html">Register</a>
  </nav>
</header>
<div class="layout">
  <aside>
    <h3>Menu</h3>
    <a href="../W5-program-5/content2.html">🏠 Home</a>
    <a href="catelogue2.html">📋 Event Catalogue</a>
    <a href="login2.html" class="active">🔐 Login</a>
    <a href="register2.html">📝 Register</a>
    <a href="../W2-program-3/imagepage2.html">🖼 Event Gallery</a>
    <a href="../W4-program-4/studentform2.html">🎫 Book Ticket</a>
    <a href="../W5-program-5/map2.html">📍 Event Location</a>
    <a href="../W1-program-1/program1.html">📊 Student Records</a>
    <a href="lms.html">🎓 LMS Portal</a>
  </aside>
  <main class="content-area">
    <div class="card" style="max-width:520px; margin:0 auto;">
      <div class="card-header">🔐 User Login</div>
      <div class="card-body">
        <div class="form-grid">
          <label>Username:</label>
          <input type="text" id="login-user" placeholder="Enter Username">
          <label>Password:</label>
          <input type="password" id="login-pass" placeholder="Enter Password">
        </div>
        <div class="form-actions">
          <button class="btn-primary" onclick="doLogin()">Login</button>
        </div>
        <div class="form-link">Don't have an account? <a href="register2.html">Register Here</a></div>
        <div class="success-box" id="login-success">✅ Login Successful! Welcome back.</div>
      </div>
    </div>
  </main>
</div>
<script>
  function doLogin() {
    const u = document.getElementById('login-user').value;
    const p = document.getElementById('login-pass').value;
    if (u && p) {
      document.getElementById('login-success').style.display = 'block';
      setTimeout(() => { window.location.href = 'index2.html'; }, 1500);
    } else {
      alert('Please enter username and password.');
    }
  }
</script>
</body>
</html>
