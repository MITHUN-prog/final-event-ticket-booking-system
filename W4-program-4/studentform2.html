<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>
<link rel="stylesheet" href="../W2-program-2/style.css">
<style>body { display: flex; flex-direction: column; min-height: 100vh; }</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<header>
  <h1>🎟 Online Event Ticket Booking</h1>
  <nav>
    <a href="../W2-program-2/index2.html">Home</a>
    <a href="../W2-program-2/catelogue2.html">Events</a>
    <a href="../W2-program-2/login2.html">Login</a>
    <a href="../W2-program-2/register2.html">Register</a>
  </nav>
</header>
<div class="layout">
  <aside>
    <h3>Menu</h3>
    <a href="../W5-program-5/content2.html">🏠 Home</a>
    <a href="../W2-program-2/catelogue2.html">📋 Event Catalogue</a>
    <a href="../W2-program-2/login2.html">🔐 Login</a>
    <a href="../W2-program-2/register2.html">📝 Register</a>
    <a href="../W2-program-3/imagepage2.html">🖼 Event Gallery</a>
    <a href="studentform2.html" class="active">🎫 Book Ticket</a>
    <a href="../W5-program-5/map2.html">📍 Event Location</a>
    <a href="../W1-program-1/program1.html">📊 Student Records</a>
    <a href="../W2-program-2/lms.html">🎓 LMS Portal</a>
  </aside>
  <main class="content-area">
    <div class="card" style="max-width:580px; margin:0 auto;">
      <div class="card-header">🎫 Student Event Registration Form</div>
      <div class="card-body">
        <div class="form-grid">
          <label>Student Name:</label>
          <input type="text" id="bt-name" placeholder="Enter your name">
          <label>Register Number:</label>
          <input type="text" id="bt-regno" placeholder="Enter register number">
          <label>Email:</label>
          <input type="email" id="bt-email" placeholder="Enter email">
          <label>Phone Number:</label>
          <input type="tel" id="bt-phone" placeholder="Enter phone number">
          <label>Gender:</label>
          <div style="display:flex; gap:20px; align-items:center;">
            <label style="font-weight:400; display:flex; align-items:center; gap:6px;"><input type="radio" name="gender" value="Male"> Male</label>
            <label style="font-weight:400; display:flex; align-items:center; gap:6px;"><input type="radio" name="gender" value="Female"> Female</label>
          </div>
          <label>Select Event:</label>
          <select id="bt-event">
            <option>Music Concert – Chennai (₹500)</option>
            <option>Dance Festival – Bangalore (₹700)</option>
            <option>Stand-up Comedy – Hyderabad (₹400)</option>
            <option>Food Festival – Mumbai (₹300)</option>
            <option>Tech Conference – Delhi (₹900)</option>
          </select>
          <label>Number of Tickets:</label>
          <input type="number" id="bt-tickets" min="1" max="10" value="1">
          <label>Event Date:</label>
          <input type="date" id="bt-date">
        </div>
        <div class="form-actions" style="margin-top:24px;">
          <button class="btn-primary" onclick="doBook()">Book Ticket</button>
          <button class="btn-secondary" onclick="clearBookForm()">Clear</button>
        </div>
        <div class="success-box" id="book-success">🎉 Booking Confirmed! Downloading Excel receipt & redirecting...</div>
      </div>
    </div>
  </main>
</div>
<script>
  function doBook() {
    const name    = document.getElementById('bt-name').value.trim();
    const regno   = document.getElementById('bt-regno').value.trim();
    const email   = document.getElementById('bt-email').value.trim();
    const phone   = document.getElementById('bt-phone').value.trim();
    const event   = document.getElementById('bt-event').value;
    const tickets = document.getElementById('bt-tickets').value;
    const date    = document.getElementById('bt-date').value;
    const gender  = document.querySelector('input[name="gender"]:checked');
    if (!name || !regno || !email || !phone || !gender) {
      alert('Please fill in all required fields.');
      return;
    }
    const bookingData = {
      name, regno, email, phone,
      gender: gender.value,
      event, tickets,
      date: date || 'Not selected',
      bookedOn: new Date().toLocaleString()
    };
    sessionStorage.setItem('booking', JSON.stringify(bookingData));
    downloadExcel(bookingData);
    document.getElementById('book-success').style.display = 'block';
    setTimeout(() => { window.location.href = 'submit2.html'; }, 2000);
  }

  function downloadExcel(data) {
    const wsData = [
      ['Online Event Ticket Booking System', '', '', ''],
      ['Booking Receipt', '', '', ''],
      ['', '', '', ''],
      ['Field', 'Details'],
      ['Student Name',      data.name],
      ['Register Number',   data.regno],
      ['Email',             data.email],
      ['Phone Number',      data.phone],
      ['Gender',            data.gender],
      ['Selected Event',    data.event],
      ['Number of Tickets', data.tickets],
      ['Event Date',        data.date],
      ['Booking Date',      data.bookedOn],
      ['', ''],
      ['Status', 'Confirmed']
    ];
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    ws['!cols'] = [{ wch: 22 }, { wch: 40 }];
    ws['!merges'] = [
      { s: { r: 0, c: 0 }, e: { r: 0, c: 3 } },
      { s: { r: 1, c: 0 }, e: { r: 1, c: 3 } }
    ];
    XLSX.utils.book_append_sheet(wb, ws, 'Booking Details');
    const fileName = 'Booking_' + data.name.replace(/\s+/g, '_') + '_' + Date.now() + '.xlsx';
    XLSX.writeFile(wb, fileName);
  }

  function clearBookForm() {
    ['bt-name','bt-regno','bt-email','bt-phone','bt-date'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('bt-tickets').value = '1';
    document.querySelectorAll('input[name="gender"]').forEach(r => r.checked = false);
  }
</script>
</body>
</html>
